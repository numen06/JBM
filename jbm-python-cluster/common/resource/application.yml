server:
  host: 0.0.0.0
  port: 3312

spring:
  application:
    name: jbm-cluster-platform-logs
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: nacos2:8848
        namespace: jbm
        group: DEFAULT_GROUP
        cluster-name: DEFAULT
      config:
        enabled: false
        server-addr: nacos2:8848
        namespace: jbm
        group: DEFAULT_GROUP
        file-extension: yml

jbm:
  cluster:
    token-type: redis
    permit-all:
      - /businessLog/get

integrations:
  openobserve:
    url: http://openobserve:5080
    org: default
    auth-token: ""
    username: ""
    password: ""
    timeout-seconds: 30
  rabbitmq:
    enabled: false
    url: amqp://guest:guest@rabbitmq:5672/
    access-logs-queue: accessLogs-in-0.jbm-cluster-platform-logs
    business-log-queue: businessLog-in-0.jbm-cluster-platform-logs
    prefetch-count: 50
  redis:
    enabled: false
    url: redis://redis:6379/0
  telemetry:
    enabled: false
