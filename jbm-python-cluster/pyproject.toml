[project]
name = "jbm-platform-runtime"
version = "7.3.0b5"
description = "Reusable Python runtime and cluster services for the JBM 7.3 technical platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.1.1",
    "alibabacloud_dypnsapi20170525>=2.0.0,<3.0.0",
    "alembic>=1.13.2",
    "aio-pika>=9.4.3",
    "aiokafka>=0.13.0,<0.14",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "bcrypt>=4.1.0",
    "captcha>=0.7.1",
    "cryptography>=42.0.0,<49.0.0",
    "httpx>=0.27.0,<0.28",
    "nacos-sdk-python==0.1.14",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "redis>=5.0.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "sse-starlette>=2.1.3,<3.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]
telemetry = [
    "openobserve-telemetry-sdk>=0.1.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common/src/jbm_cluster_py",
]

[tool.hatch.build.targets.wheel.force-include]
"integrations/src/jbm_cluster_py/integrations" = "jbm_cluster_py/integrations"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["common/src", "integrations/src", "auth/src", "doc/src", "push/src", "job/src", "gateway/src", "center/src", "logs/src", "bigscreen/src"]
testpaths = ["common/tests", "auth/tests", "doc/tests", "push/tests", "job/tests", "gateway/tests", "center/tests", "logs/tests", "bigscreen/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
