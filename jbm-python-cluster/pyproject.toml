[project]
name = "jbm-python-cluster"
version = "0.1.0"
description = "Pure Python cluster services for the JBM 7.3 technical platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.1.1",
    "alembic>=1.13.2",
    "aio-pika>=9.4.3",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "bcrypt>=4.1.0",
    "captcha>=0.7.1",
    "cryptography>=42.0.0",
    "httpx>=0.27.0,<0.28",
    "nacos-sdk-python==0.1.14",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "redis>=5.0.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "sse-starlette>=2.1.3",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]
telemetry = [
    "openobserve-telemetry-sdk>=0.1.0",
]

[project.scripts]
jbm-python-auth = "jbm_cluster_py.platform.auth.main:run"
jbm-python-doc = "jbm_cluster_py.platform.doc.main:run"
jbm-python-push = "jbm_cluster_py.platform.push.main:run"
jbm-python-job = "jbm_cluster_py.platform.job.main:run"
jbm-python-gateway = "jbm_cluster_py.platform.gateway.main:run"
jbm-python-center = "jbm_cluster_py.platform.center.main:run"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common/src/jbm_cluster_py",
    "integrations/src/jbm_cluster_py",
    "auth/src/jbm_cluster_py",
    "doc/src/jbm_cluster_py",
    "push/src/jbm_cluster_py",
    "job/src/jbm_cluster_py",
    "gateway/src/jbm_cluster_py",
    "center/src/jbm_cluster_py",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["common/src", "integrations/src", "auth/src", "doc/src", "push/src", "job/src", "gateway/src", "center/src"]
testpaths = ["common/tests", "auth/tests", "doc/tests", "push/tests", "job/tests", "gateway/tests", "center/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
