# Pure logs stay in Loki behind the JBM logs service. Business facts use TDengine.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki/backend-v1
  storage:
    filesystem:
      chunks_directory: /tmp/loki/backend-v1/chunks
      rules_directory: /tmp/loki/backend-v1/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /tmp/loki/backend-v1/compactor
  retention_enabled: true
  delete_request_store: filesystem
querier:
  query_ingesters_within: 0s
ingester:
  # Single-binary filesystem mode otherwise overrides the querier's zero
  # lookback with ~2h41m, hiding historical writes until their chunks flush.
  # Loki's infinite sentinel is exactly time.Duration(-1), i.e. -1ns.
  query_store_max_look_back_period: -1ns
limits_config:
  max_query_length: 768h
  retention_period: 8760h
  deletion_mode: disabled
  reject_old_samples_max_age: 8760h
analytics:
  reporting_enabled: false
