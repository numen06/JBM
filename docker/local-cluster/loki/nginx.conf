server {
    listen 3100;
    server_name _;

    auth_basic "JBM Loki";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 20m;

    # Log readers/writers cannot delete historical logs or administer Loki.
    location = /loki/api/v1/delete { return 403; }
    location = /config { return 403; }
    location ~ ^/(flush|shutdown|ingester/|compactor/|log_level) { return 403; }

    location / {
        proxy_pass http://loki-backend:3100;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
}
