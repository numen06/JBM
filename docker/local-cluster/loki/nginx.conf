server {
    listen 3100;
    server_name _;

    auth_basic "JBM Loki";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 20m;

    location / {
        proxy_pass http://loki-backend:3100;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
}
