integrations:
  database:
    url: mysql+asyncmy://root:jbm-local@mysql:3306/jbm-7.3?charset=utf8mb4
  redis:
    enabled: true
    url: redis://:jbm-local-redis@redis:6379/0
  rabbitmq:
    enabled: true
    url: amqp://jbm:jbm-local@rabbitmq:5672/
  kafka:
    enabled: true
    bootstrap-servers: kafka:9092
    security-protocol: SASL_PLAINTEXT
    sasl-mechanism: PLAIN
    username: jbm
    password: jbm-local-kafka
    access-logs-topic: jbm.logs.access.v1
    business-logs-topic: jbm.logs.business.v1
    consumer-group: jbm-cluster-platform-logs
  storage:
    backend: minio
    local-dir: ./data/files
  minio:
    enabled: true
    endpoint-url: http://minio:9000
    bucket: jbm-docs
    access-key: jbm-local
    secret-key: jbm-local-minio
    region: us-east-1
    secure: false
spring:
  cloud:
    nacos:
      discovery:
        metadata:
          version: 7.3.0
jbm:
  security:
    password-policy:
      min-length: 8
      max-length: 128
      required-character-classes: 3
