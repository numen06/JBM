retrofit:
  global-log:
    enable: true
  platforms:
    platformA:
      base-url: http://127.0.0.1:8089
      client-id: client_id
      client-secret: client_secret
#      signature-strategy: HMAC_SHA256
#      auth-strategy: oauth2
      extend:
        token-url: http://127.0.0.1:8089/oauth/token
    platformB:
      base-url: http://127.0.0.1:8089
      client-id: client_id
      client-secret: client_secret
#      signature-strategy: RSA
      extend:
        token-url: http://127.0.0.1:8089/oauth/token