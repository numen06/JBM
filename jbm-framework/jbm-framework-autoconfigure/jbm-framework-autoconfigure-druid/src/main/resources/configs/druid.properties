spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
# 初始连接数：与 min-idle 保持一致，避免启动时创建过多连接
spring.datasource.druid.initial-size=2
# 最小空闲连接数
spring.datasource.druid.min-idle=2
# 最大活跃连接数（公式建议：MySQL max_connections / 服务实例数 - 预留连接）
spring.datasource.druid.max-active=10
# 获取连接最大等待时间（毫秒），超时抛异常而非无限等待
spring.datasource.druid.max-wait=10000
# 检测空闲连接的间隔时间（毫秒）
spring.datasource.druid.time-between-eviction-runs-millis=30000
# 连接最小空闲时间（毫秒），超过此时间的空闲连接会被回收
spring.datasource.druid.min-evictable-idle-time-millis=300000
# 最大可驱逐的空闲连接时间（毫秒），确保超过此时间的连接被强制回收（小于 MySQL wait_timeout）
spring.datasource.druid.max-evictable-idle-time-millis=900000
# 连接保活：对空闲超过 min-evictable-idle-time-millis 的连接发送心跳，防止被 MySQL 服务端断开
spring.datasource.druid.keep-alive=true
# 验证查询语句
spring.datasource.druid.validation-query=SELECT 1
# 验证查询超时时间（秒），防止验证查询本身卡住
spring.datasource.druid.validation-query-timeout=3
# 仅在空闲时验证连接（推荐，性能最优）
spring.datasource.druid.test-while-idle=true
# 借出时不验证（关闭！每次 SELECT 1 会严重拖慢高并发场景）
spring.datasource.druid.test-on-borrow=false
# 归还时不验证
spring.datasource.druid.test-on-return=false
# 连接泄露检测：自动回收被遗弃的连接
spring.datasource.druid.remove-abandoned=true
# 连接被遗弃超过此时间（秒）后会被回收
spring.datasource.druid.remove-abandoned-timeout=300
# 连接被遗弃时记录日志
spring.datasource.druid.log-abandoned=true
# 连接超时时间（毫秒），网络层连接建立超时
spring.datasource.druid.connect-timeout=5000
# socket 读写超时（毫秒），防止慢查询卡住连接
spring.datasource.druid.socket-timeout=120000
# 关闭 PreparedStatement 缓存（MySQL 下建议关闭，PS 缓存由 MySQL 服务端和驱动自行管理）
spring.datasource.druid.pool-prepared-statements=false
# 启用 Druid 监控统计过滤器
spring.datasource.druid.filters=stat,wall
# 慢 SQL 阈值（毫秒）
spring.datasource.druid.use-global-data-source-stat=true
spring.datasource.druid.connect-properties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
# Druid 监控页面配置
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=admin@druid
spring.datasource.druid.stat-view-servlet.reset-enable=false
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
# Web 监控过滤器
spring.datasource.druid.web-stat-filter.url-pattern=/*
spring.datasource.druid.web-stat-filter.exclusions=*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*