#\u9ed8\u8ba4\u914d\u7f6e
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.global-config.db-config.column-underline=true
#mybatis-plus.global-config.db-config.capital-mode= true
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.refresh=true
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=true
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.type-handlers-package=com.jbm.framework.masterdata.typehandler
# 启用 Flyway
spring.flyway.enabled=false
# 若首次在已有数据库上运行迁移，设为 true（否则会报错）
spring.flyway.baseline-on-migrate=true
# 迁移脚本的位置（替换原有的InitializeSqlProcessor功能，使用sql/schema目录）
spring.flyway.locations=classpath:db/migration
# 脚本文件编码
spring.flyway.encoding=UTF-8
# 执行迁移前校验脚本的 checksum（防止脚本被意外修改）
spring.flyway.validate-on-migrate=true
# （可选）禁止 flyway clean 命令，生产环境强烈建议开启
spring.flyway.clean-disabled=true
# 忽略不支持的数据库
spring.flyway.fail-on-unsupported-database=false

# HikariCP 连接池配置（当 Druid 未生效时的备用配置）
# 限制最大连接数，防止"Too many connections"错误（与 Druid max-active=20 保持一致）
spring.datasource.hikari.maximum-pool-size=50
# 最小空闲连接数（与 Druid min-idle=3 保持一致）
spring.datasource.hikari.minimum-idle=3
# 连接超时时间（毫秒）
spring.datasource.hikari.connection-timeout=30000
# 连接最大生命周期（毫秒），超过此时间的连接会被关闭并重新创建
spring.datasource.hikari.max-lifetime=180000
# 空闲连接超时时间（毫秒），空闲连接超过此时间会被关闭
spring.datasource.hikari.idle-timeout=60000
# 连接测试查询
spring.datasource.hikari.connection-test-query=SELECT 1
# 连接池名称
spring.datasource.hikari.pool-name=HikariCP-Pool
