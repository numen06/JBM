name: jbm73-python

x-python-config: &python-config >-
  {"integrations":{"database":{"url":"mysql+asyncmy://root:jbm-local@mysql:3306/jbm-7.3?charset=utf8mb4"},"redis":{"enabled":true,"url":"redis://redis:6379/0"},"rabbitmq":{"enabled":true,"url":"amqp://jbm:jbm-local@rabbitmq:5672/"},"kafka":{"enabled":true,"bootstrap-servers":"kafka:9092","access-logs-topic":"jbm.logs.access.v1","business-logs-topic":"jbm.logs.business.v1","consumer-group":"jbm-cluster-platform-logs"},"storage":{"backend":"minio","local-dir":"./data/files"},"minio":{"enabled":true,"endpoint-url":"http://minio:9000","bucket":"jbm-docs","access-key":"jbm-local","secret-key":"jbm-local-minio","region":"us-east-1","secure":false}},"spring":{"cloud":{"nacos":{"config":{"enabled":false},"discovery":{"enabled":true,"server-addr":"rnacos:8848","namespace":"jbm7","group":"DEFAULT_GROUP"}}}},"jbm":{"auth":{"jwt":{"issuer":"http://jbm-cluster-platform-auth:5555","audience":"jbm-api"}},"gateway":{"access-log":{"enabled":true,"ingest-enabled":false,"topic":"jbm.logs.access.v1"}},"logs":{"signing-secret":"jbm-local-business-log-signing-key","loki":{"enabled":true,"url":"http://loki:3100/loki/api/v1/push","tenant-id":"platform"}},"bigscreen":{"views-dir":"/app/data/views","doc-base-url":"http://jbm-cluster-platform-doc:9999"},"center":{"security":{"enabled":true,"userinfo-url":"http://jbm-cluster-platform-auth:5555/oauth2/userinfo"},"seed":{"enabled":true,"admin-password":"Admin@123","platform-operator-password":"Operator@123","tenant-admin-password":"Tenant@123","force-reset-password":true}}}}

x-python-environment: &python-environment
  JBM_PROFILE: jaja7
  JBM_CONFIG_JSON: *python-config

x-python-service: &python-service
  image: jbm73-python-cluster:local
  restart: unless-stopped
  networks: [jbm73-python]
  healthcheck:
    test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['JBM_HEALTH_PORT']+'/actuator/health',timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 20s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: jbm-local
      MYSQL_DATABASE: jbm-7.3
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [jbm73-python]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pjbm-local --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    networks: [jbm73-python]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: jbm
      RABBITMQ_DEFAULT_PASS: jbm-local
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [jbm73-python]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: m.daocloud.io/docker.io/apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports: ["127.0.0.1:29092:29092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    networks: [jbm73-python]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s

  loki:
    image: m.daocloud.io/docker.io/grafana/loki:3.7.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:13100:3100"]
    volumes: ["loki-data:/tmp/loki"]
    networks: [jbm73-python]
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "--config.file=/etc/loki/local-config.yaml", "--verify-config=true"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jbm-local
      MINIO_ROOT_PASSWORD: jbm-local-minio
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes: ["minio-data:/data"]
    networks: [jbm73-python]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  rnacos:
    image: qingpan/rnacos:v0.6.6
    restart: unless-stopped
    environment:
      RUST_LOG: info
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:10848:10848"
    volumes: ["rnacos-data:/io"]
    networks: [jbm73-python]

  rnacos-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["/bin/sh", "/init/rnacos-init.sh"]
    volumes:
      - ./docker/local-cluster/rnacos-init.sh:/init/rnacos-init.sh:ro
    networks: [jbm73-python]
    depends_on:
      rnacos: {condition: service_started}

  jbm-cluster-platform-center:
    <<: *python-service
    build:
      context: ./jbm-python-cluster
      dockerfile: Dockerfile
    environment:
      <<: *python-environment
      JBM_APP: center
      JBM_HEALTH_PORT: "7777"
    command: ["sh", "-c", "alembic -c center/alembic.ini upgrade head && python -m jbm_cluster_py.platform.center.bootstrap.seed && python -m jbm_cluster_py.platform.center.main"]
    ports: ["127.0.0.1:7777:7777"]
    depends_on:
      mysql: {condition: service_healthy}
      rnacos-init: {condition: service_completed_successfully}

  jbm-cluster-platform-auth:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: auth
      JBM_HEALTH_PORT: "5555"
    command: ["python", "-m", "jbm_cluster_py.platform.auth.main"]
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}
      redis: {condition: service_healthy}

  jbm-cluster-platform-doc:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: doc
      JBM_HEALTH_PORT: "9999"
    command: ["python", "-m", "jbm_cluster_py.platform.doc.main"]
    ports: ["127.0.0.1:9999:9999"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}
      minio: {condition: service_healthy}

  jbm-cluster-platform-push:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: push
      JBM_HEALTH_PORT: "3313"
    command: ["python", "-m", "jbm_cluster_py.platform.push.main"]
    ports: ["127.0.0.1:3313:3313"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  jbm-cluster-platform-job:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: job
      JBM_HEALTH_PORT: "4444"
    command: ["python", "-m", "jbm_cluster_py.platform.job.main"]
    ports: ["127.0.0.1:4444:4444"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}

  jbm-cluster-platform-logs:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: logs
      JBM_HEALTH_PORT: "3312"
    command: ["python", "-m", "jbm_cluster_py.platform.logs.main"]
    ports: ["127.0.0.1:3312:3312"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}
      kafka: {condition: service_healthy}
      loki: {condition: service_healthy}

  jbm-cluster-platform-bigscreen:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: bigscreen
      JBM_HEALTH_PORT: "3314"
    command: ["python", "-m", "jbm_cluster_py.platform.bigscreen.main"]
    ports: ["127.0.0.1:3314:3314"]
    volumes: ["bigscreen-data:/app/data"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}
      jbm-cluster-platform-doc: {condition: service_healthy}

  jbm-cluster-platform-gateway:
    <<: *python-service
    environment:
      <<: *python-environment
      JBM_APP: gateway
      JBM_HEALTH_PORT: "6060"
    command: ["python", "-m", "jbm_cluster_py.platform.gateway.main"]
    ports: ["127.0.0.1:6060:6060"]
    depends_on:
      jbm-cluster-platform-center: {condition: service_healthy}
      jbm-cluster-platform-auth: {condition: service_healthy}
      jbm-cluster-platform-doc: {condition: service_healthy}
      jbm-cluster-platform-push: {condition: service_healthy}
      jbm-cluster-platform-job: {condition: service_healthy}
      jbm-cluster-platform-logs: {condition: service_healthy}
      jbm-cluster-platform-bigscreen: {condition: service_healthy}
      kafka: {condition: service_healthy}

  jbm-admin:
    build:
      context: ./jbm-admin-vue
      dockerfile: Dockerfile.local
    restart: unless-stopped
    environment:
      JBM_ADMIN_DEBUG: "true"
      JBM_OAUTH_CLIENT_ID: jbmSeedDevAppKey00000001
      JBM_API_PREFIX: /v3/api/
    ports: ["127.0.0.1:5173:80"]
    networks: [jbm73-python]
    depends_on:
      jbm-cluster-platform-gateway: {condition: service_healthy}

networks:
  jbm73-python:
    name: jbm73-python

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  kafka-data:
  loki-data:
  rnacos-data:
  minio-data:
  bigscreen-data:
