version: '1.0'
build:
  project_type: python
  use_project_dockerfile: true
  dockerfile_name: Dockerfile.app2docker
  platforms:
  - linux/amd64
  - linux/arm64
  build_args:
    RELEASE_VERSION: py-7.3-20261104.7
    JBM_COMMIT: '{full_commit}'
    RELEASE_TARGET: jbm-admin
git:
  branch: py-7.3
image:
  name: registry.cn-shanghai.aliyuncs.com/okc/jbm-admin
  tag: py-7.3-20261104.7
  push: true
push_mode: single
release:
  enabled: true
  platform: jbm
  mainline: py-7.3
  version_file: VERSION
  timezone: Asia/Shanghai
  immutable: true
  require_git_tag: true
  service_policies:
    jbm7_jbm-admin:
      stack: jbm7
      replicas: 1
      restartPolicy:
        Condition: on-failure
        Delay: 5000000000
        MaxAttempts: 0
