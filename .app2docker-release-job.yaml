version: '1.0'
build:
  project_type: python
  use_project_dockerfile: true
  dockerfile_name: Dockerfile.app2docker
  platforms:
  - linux/amd64
  - linux/arm64
  build_args:
    MYSQL_CLIENT_IMAGE: m.daocloud.io/docker.io/library/mysql:8.4
    RELEASE_VERSION: py-7.3-20261103.1
    JBM_COMMIT: '{full_commit}'
    RELEASE_TARGET: jbm-cluster-platform-job
git:
  branch: py-7.3
image:
  name: registry.cn-shanghai.aliyuncs.com/okc/jbm-cluster-platform-job
  tag: py-7.3-20261103.1
  push: true
push_mode: single
release:
  enabled: true
  platform: jbm
  mainline: py-7.3
  version_file: VERSION
  timezone: Asia/Shanghai
  immutable: true
  require_git_tag: true
  service_policies:
    jbm7_jbm-cluster-platform-job:
      stack: jbm7
      replicas: 1
      healthcheck:
        Test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4444/actuator/health',timeout=3)"
        Interval: 15000000000
        Timeout: 5000000000
        StartPeriod: 30000000000
        Retries: 12
      deployment:
        singleActiveWorker: true
        ownership: exclusive-file-lock
        startup: background-retry-2s
        restart: stack-policy
