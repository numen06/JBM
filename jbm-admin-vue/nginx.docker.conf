server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker 内置 DNS，便于 upstream 服务名解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream jbm-cluster-platform-gateway:6060;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(oauth2|captcha|qrcode|user|current|authority|role|menu|account|online|statistics|internal|app|gateway|baseDic|developer|baseOrg|baseAccountLogs|action|api|baseAuthorityAction|baseAuthorityRole|baseAuthorityUser|baseAuthorityApp|gatewayRateLimitApi|gatewayIpLimitApi|extend-field|code)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$gateway_upstream;
    }
}
