databaseChangeLog:
  - changeSet:
      id: extendfield-designer-form-definition-1
      author: jbm
      changes:
        - createTable:
            tableName: md_extend_form_definition
            remarks: 动态表单定义（真源在库，按租户隔离）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: form_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: form_name
                  type: VARCHAR(128)
              - column:
                  name: fields_json
                  type: CLOB
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: 1
              - column:
                  name: update_time
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: md_extend_form_definition
            columnNames: tenant_id, form_code
            constraintName: uk_tenant_form_code
