databaseChangeLog:
  - changeSet:
      id: micro-mysql-md-extend-demo-1
      author: jbm
      changes:
        - createTable:
            tableName: md_extend_demo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
              - column:
                  name: app_id
                  type: BIGINT
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: level
                  type: INT
              - column:
                  name: leaf_path
                  type: VARCHAR(512)
              - column:
                  name: create_time
                  type: TIMESTAMP
              - column:
                  name: update_time
                  type: TIMESTAMP
              - column:
                  name: biz_code
                  type: VARCHAR(64)
              - column:
                  name: title
                  type: VARCHAR(256)
              - column:
                  name: extend_data
                  type: CLOB
                  remarks: JSON 扩展字段
