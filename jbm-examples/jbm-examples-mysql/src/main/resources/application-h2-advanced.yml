# 多数据源（baomidou dynamic-datasource）+ 多租户演示：仅在使用 profile {@code h2-advanced} 时启用（测试里通过 spring.profiles.active 覆盖默认 h2）。
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:h2:mem:md_advanced_master;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
          driver-class-name: org.h2.Driver
          username: sa
          password: ""
        slave:
          url: jdbc:h2:mem:md_advanced_slave;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
          driver-class-name: org.h2.Driver
          username: sa
          password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    enabled: true
    change-log: classpath:db/examples-mysql/db.changelog-master.yaml

logging:
  level:
    root: INFO
    com.jbm.micro.mysql: DEBUG
