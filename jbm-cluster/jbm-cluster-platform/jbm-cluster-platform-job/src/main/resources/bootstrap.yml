server:
  port: 4444
spring:
  application:
    name: ${artifactId}
  cloud:
    #手动配置Bus id,
    bus:
      id: ${spring.application.name}:${server.port}
    function:
      definition: scheduledJob;
    stream:
      #      default-binder: kafka
      bindings:
        scheduledJob-in-0:
          group: ${spring.application.name}
          consumer:
            max-attempts: 3                # ✅ 重试 3 次（含首次）
            back-off-initial-interval: 1000 # 初始退避 1 秒
            back-off-multiplier: 2          # 指数退避：1s, 2s, 4s
            back-off-max-interval: 10000    # 最大间隔 10
    rabbit:
      bindings:
        scheduledJob-in-0:
          consumer:
            acknowledge-mode: auto           # auto 模式由 Spring 控制 ACK/NACK
            auto-bind-dlq: true              # 自动创建 DLQ
            republish-to-dlq: true           # 失败后转发到 DLQ
  main:
    allow-bean-definition-overriding: true
    #2.6版本后增加循环引用判断
    allow-circular-references: true
  #解决restful 404错误 spring.mavc.throw-exception-if-no-handler-found=true spring.resources.add-mappings=false
  mvc:
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher
  resources:
    add-mappings: false
  profiles:
    active: ${profile.name}

management:
  endpoints:
    web:
      exposure:
        include: '*'
jbm:
  cluster:
    nacos-confs: common.properties,redis.properties,rabbitmq.properties,db.properties,mqtt.properties
    token-type: redis
    permit-all:
      - /get/**
swagger2:
  enabled: true
  description: 平台任务调度服务
  title: 平台任务调度服务
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
