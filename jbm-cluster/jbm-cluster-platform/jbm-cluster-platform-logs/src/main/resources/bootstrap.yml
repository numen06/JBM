server:
  port: 3312
spring:
  application:
    name: ${artifactId}
  cloud:
    #手动配置Bus id,
    bus:
      refresh:
        enabled: true
      id: ${spring.application.name}:${server.port}
    function:
      definition: accessLogs;businessLog;
    stream:
      #      default-binder: kafka
      bindings:
        accessLogs-in-0:
          group: ${spring.application.name}
        # 业务日志消费者配置
        businessLog-in-0:
          group: ${spring.application.name}
    nacos:
      config:
        namespace: jbm
        #        group: ${config.group}
        server-addr: nacos2:8848
        shared-configs:
          - { data-id: common.properties, refresh: true }
          - { data-id: redis.properties }
          - { data-id: rabbitmq.properties }
          - { data-id: openobserve.yml }
        file-extension: yml
  resources:
    add-mappings: false
management:
  endpoints:
    web:
      exposure:
        include: '*'
jbm:
  cluster:
    token-type: redis
    permit-all:
      - /businessLog/get
#      - /authority/access
#      - /authority/app
#      - /app/*/info
#      - /app/client/*/info
#      - /gateway/api/**
#      - /user/add/thirdParty
#      - /user/info
#      - /user/login
#      - /developer/add/thirdParty
#      - /developer/info
#      - /developer/login
swagger2:
  enabled: true
  description: 日志处理基础服务器
  title: 日志处理基础服务器

