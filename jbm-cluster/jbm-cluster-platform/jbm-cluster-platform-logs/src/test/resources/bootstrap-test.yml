server:
  port: 3315
spring:
  application:
    name: jbm-cluster-platform-log-test
  cloud:
    #手动配置Bus id,
    bus:
      id: ${spring.application.name}:${server.port}
    function:
      definition: accessLogs;businessLog
    stream:
      #      default-binder: kafka
      bindings:
        accessLogs-in-0:
          group: ${spring.application.name}
        # 业务日志消费者配置
        businessLog-in-0:
          destination: cloud.business.log
          group: business-log-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
    nacos:
      config:
        namespace: jbm
        #        group: ${config.group}
        server-addr: 10.100.10.62:8848
        shared-configs:
          - { data-id: common.properties, refresh: true }
          - { data-id: redis.properties }
          - { data-id: rabbitmq.properties }
          - { data-id: openobserve.yml }
        file-extension: yml
      discovery:
        namespace: jbm
        #        group: ${config.group}
        server-addr: 10.100.10.62:8848
management:
  endpoints:
    web:
      exposure:
        include: '*'
jbm:
  cluster:
    token-type: redis
#    permit-all:
#      - /authority/access
#      - /authority/app
#      - /app/*/info
#      - /app/client/*/info
#      - /gateway/api/**
#      - /user/add/thirdParty
#      - /user/info
#      - /user/login
#      - /developer/add/thirdParty
#      - /developer/info
#      - /developer/login
swagger2:
  enabled: true
  description: 日志处理基础服务器
  title: 日志处理基础服务器

