server:
  port: 5555
  max-http-header-size: 204800
  servlet:
    session:
      cookie:
        name: OAUTH2SESSION
spring:
  main:
    allow-bean-definition-overriding: false
  application:
    name: ${artifactId}
  cloud:
    #手动配置Bus id,
    bus:
      id: ${spring.application.name}:${server.port}
  profiles:
    active: ${profile.name}
  web:
    resources:
      add-mappings: false
  thymeleaf:
    enabled: true
    mode: HTML
    encoding: UTF-8
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    check-template: true
    check-template-location: true
management:
  endpoints:
    web:
      exposure:
        include: '*'


swagger2:
  enabled: true
  description: 平台用户认证服务器
  title: 平台用户认证服务器
jbm:
  # 系统调试模式，环境变量 JBM_DEBUG=true 时开启（生产环境须保持 false）
  # 开启后图形码 9999、短信码 99999 可作为替代码通过校验；空/错误码仍会被拒绝
  debug: ${JBM_DEBUG:false}
