server:
  port: 5555
  max-http-header-size: 204800
  servlet:
    session:
      cookie:
        name: OAUTH2SESSION
spring:
  main:
    allow-bean-definition-overriding: false
  application:
    name: ${artifactId}
  cloud:
    #手动配置Bus id,
    bus:
      id: ${spring.application.name}:${server.port}
  profiles:
    active: ${profile.name}
  web:
    resources:
      add-mappings: false
management:
  endpoints:
    web:
      exposure:
        include: '*'


