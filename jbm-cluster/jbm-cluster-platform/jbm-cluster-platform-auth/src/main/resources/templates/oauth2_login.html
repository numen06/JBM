<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - OAuth2 认证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 340px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 48px;
            height: 48px;
            fill: #f0f6fc;
        }

        .app-name {
            font-size: 24px;
            font-weight: 300;
            color: #f0f6fc;
            margin-top: 16px;
            letter-spacing: -0.5px;
        }

        .login-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
        }

        .login-header {
            text-align: center;
            padding: 16px 0 8px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 300;
            color: #f0f6fc;
            letter-spacing: -0.5px;
        }

        .login-form {
            padding: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: #c9d1d9;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: #c9d1d9;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
            height: 32px;
        }

        .form-control:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .form-control:hover {
            border-color: #8b949e;
        }

        .btn {
            width: 100%;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid;
            border-radius: 6px;
            appearance: none;
            transition: all 0.2s cubic-bezier(0.3, 0, 0.5, 1);
            height: 32px;
        }

        .btn-primary {
            color: #ffffff;
            background-color: #238636;
            border-color: rgba(240, 246, 252, 0.1);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #2ea043;
            border-color: rgba(240, 246, 252, 0.1);
        }

        .btn-primary:active:not(:disabled) {
            background-color: #26a148;
            box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .btn-primary:disabled {
            color: rgba(240, 246, 252, 0.5);
            background-color: rgba(35, 134, 54, 0.6);
            border-color: rgba(240, 246, 252, 0.1);
            cursor: not-allowed;
        }

        .error-message {
            padding: 8px 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #ff7b72;
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            border-radius: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .divider {
            position: relative;
            margin: 16px 0;
            text-align: center;
            color: #7d8590;
            font-size: 13px;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #21262d;
        }

        .divider-text {
            position: relative;
            padding: 0 12px;
            background-color: #161b22;
        }

        .footer-box {
            margin-top: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 14px;
        }

        .footer-box a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer-box a:hover {
            text-decoration: underline;
        }

        .oauth-info {
            margin-top: 16px;
            padding: 12px;
            background-color: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.4);
            border-radius: 6px;
            font-size: 12px;
            color: #79c0ff;
        }

        .oauth-info strong {
            color: #58a6ff;
        }

        .loading {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #238636;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-description {
            text-align: center;
            color: #7d8590;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <!-- Logo and App Name -->
    <div class="logo-container">
        <svg class="logo" height="48" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="48">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <div class="app-name">JBM OAuth2</div>
        <div class="app-description">授权登录系统</div>
    </div>

    <!-- Login Box -->
    <div class="login-box">
        <div class="login-header">
            <h1 class="login-title">登录账户</h1>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form class="login-form" id="loginForm" method="POST" action="/oauth2/doLogin">
            <input type="hidden" name="response_type" th:value="${response_type}">
            <input type="hidden" name="client_id" th:value="${client_id}">
            <input type="hidden" name="redirect_uri" th:value="${redirect_uri}">
            <input type="hidden" name="scope" th:value="${scope}">
            <input type="hidden" name="state" th:value="${state}">

            <div class="form-group">
                <label class="form-label" for="username">
                    用户名或邮箱地址
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        autocomplete="username"
                        autofocus
                        required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    密码
                </label>
                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    登录
                </button>
            </div>

            <div class="loading" id="loading"></div>
        </form>

        <div class="oauth-info" th:if="${client_id}">
            <strong>OAuth2 授权请求</strong><br>
            客户端 ID: <span th:text="${client_id}">未知客户端</span>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-box">
        还没有账户？ <a href="/oauth2/register">创建账户</a>
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        // 清除错误信息
        errorMessage.classList.remove('show');
        errorMessage.textContent = '';

        // 禁用按钮并显示加载动画
        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';
        loading.style.display = 'block';

        const formData = new FormData(loginForm);

        try {
            const response = await fetch('/oauth2/doLogin', {
                method: 'POST',
                body: formData
            });

            // 如果是重定向响应
            if (response.redirected) {
                window.location.href = response.url;
                return;
            }

            const result = await response.json();

            if (result.success || result.code === 200) {
                // 登录成功，使用后端返回的重定向URL
                const redirectUrl = result.result || result.data;
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                } else {
                    // 如果后端没有返回重定向URL，自己构建
                    const responseType = document.querySelector('input[name="response_type"]').value;
                    const clientId = document.querySelector('input[name="client_id"]').value;
                    const redirectUri = document.querySelector('input[name="redirect_uri"]').value;
                    const scope = document.querySelector('input[name="scope"]').value;
                    const state = document.querySelector('input[name="state"]').value;

                    let url = '/oauth2/authorize?response_type=' + responseType
                        + '&client_id=' + clientId
                        + '&redirect_uri=' + encodeURIComponent(redirectUri)
                        + '&scope=' + (scope || '');

                    if (state) {
                        url += '&state=' + encodeURIComponent(state);
                    }

                    window.location.href = url;
                }
            } else {
                // 登录失败
                showError(result.msg || result.message || '登录失败，请检查用户名和密码');
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('网络错误，请稍后重试');
        } finally {
            // 恢复按钮状态
            submitBtn.disabled = false;
            submitBtn.textContent = '登录';
            loading.style.display = 'none';
        }
    });

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
    }

    // 添加输入框焦点样式
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.01)';
        });

        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
</script>
</body>
</html>
