spring:
  cloud:
    nacos:
      config:
        namespace: jbm7
        group: DEFAULT_GROUP
        refreshable-dataids: common.properties
        server-addr: 10.100.10.62:8848
        shared-dataids: common.properties,db.properties,redis.properties,rabbitmq.properties,baidu.properties
      discovery:
        namespace: jbm7
        group: DEFAULT_GROUP
        server-addr: 10.100.10.62:8848
jbm:
  api:
    # jaja7 本地联调：jbm 基础应用客户端允许明文密码
    login-plaintext-dev-only: true
  cluster:
    data-init:
      enabled: false
      # 手动恢复 admin 默认密码时再调用重置接口，避免每次重启覆盖已修改的密码
      force-reset-default-password: false
      manual-reset-enabled: true
      root-password: admin
  extend-field:
    enabled: true
    source: REDIS
    auto-flatten: true
    sync-local-to-redis-on-startup: false
    builtin-definition-controller-enabled: false
    tenant:
      enabled: true
      header: tenantId
      default-tenant-id: "0"
      use-default-when-missing: true
