server:
  port: 3315
spring:
  application:
    name: ${artifactId}
  cloud:
    nacos:
      config:
        refreshable-dataids: common.properties
        shared-dataids: ${jbm.cluster.nacos-confs}
        file-extension: yml
  profiles:
    active: ${profile.name}
  web:
    resources:
      add-mappings: false
management:
  endpoints:
    web:
      exposure:
        include: '*'
jbm:
  cluster:
    nacos-confs: common.properties,rabbitmq.properties,redis.properties
    #    nacos-confs: common.properties,rabbitmq.properties,kafka.properties,redis.properties,db.properties,mqtt.properties,sms.properties,mail.properties
    #    nacos-confs: common.properties,redis.properties,db.properties,mqtt.properties,sms.properties,mail.properties
    token-type: redis
    permit-all:
      - /get/**
swagger2:
  enabled: true
  description: 平台AI服务器
  title: 平台AI服务器

# 阿里云 DashScope (通义千问) 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:sk-test}
  model: qwen-max  # 使用 qwen-max 提高 Function Calling 准确性（qwen-plus/qwen-turbo 也可用）
  temperature: 0.1  # 极低温度确保 Function Calling 准确性，避免输出 JSON 文本
  max-tokens: 2000
  enable-search: false
  # Agent 模式（推荐开启）
  # true: 使用 4 个元函数，AI 自己搜索和执行 API（Token 消耗少，速度快）
  # false: 将所有 API 注册为函数（Token 消耗大，可能超限）
  agent-mode: true
  # API 元数据缓存配置
  api-cache-enabled: true
  api-cache-file: data/api-metadata-cache.json

# Agent 模块化架构配置
agent:
  # NLU（自然语言理解）配置
  nlu:
    model: qwen-max  # 使用的 AI 模型
    temperature: 0.1  # 温度参数，越低越稳定
    max-tokens: 500  # 意图识别最大 tokens
    max-services: 10  # API 概述中最多显示的服务数
    max-apis-per-service: 5  # 每个服务最多显示的 API 数
  
  # API Selection（API 选择）配置
  selection:
    match-threshold: 0.3  # 匹配分数阈值（0.3 较宽松，0.5 较严格）
    cache-duration: 60  # API 缓存有效期（秒）
  
  # Execution（执行）配置
  execution:
    timeout: 30  # API 调用超时时间（秒）
    retries: 0  # 重试次数

