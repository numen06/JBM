server:
  port: 6060
spring:
  cloud:
    nacos:
      config:
        namespace: jbm7
        group: DEFAULT_GROUP
        refreshable-dataids: common.properties
        server-addr: 10.100.10.62:8848
        shared-dataids: common.properties,db.properties,redis.properties,rabbitmq.properties,baidu.properties
      discovery:
        namespace: jbm7
        group: DEFAULT_GROUP
        server-addr: 10.100.10.62:8848
    sentinel:
      datasource:
        ds1:
          nacos:
            namespace: jbm7

jbm:
  gateway:
    loadbalancer:
      prefer-local: true
  api:
    check-sign: true
    check-auth: true
    sign-expire-ms: 300000
    sign-ignores:
      - /**/login/**
      - /**/logout/**
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /**/captcha/**
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /qrcode/**
      - /code
    auth-ignores:
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /**/captcha/**
      - /qrcode/**
      - /code
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /published-docs/**
      - /**/published-docs/**
      - /actuator/**

# jaja7 网关 SaReactorFilter 放行（覆盖 bootstrap 默认值，与 sign/auth-ignores 对齐）
security:
  ignore:
    whites:
      - /favicon.ico
      - /static/favicon.ico
      - /actuator/**
      - /code
      - /oauth2/**
      - /captcha/**
      - /**/captcha/**
      - /qrcode/**
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /published-docs/**
      - /**/published-docs/**
      - /*/v2/api-docs
