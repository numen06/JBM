server:
  port: 7777
spring:
  cloud:
    gateway:
      routes:
        - id: jaja7-center-local
          uri: http://127.0.0.1:8888
          predicates:
            - Path=/user/**,/current/**,/authority/**,/role/**,/menu/**,/account/**,/online/**,/statistics/**,/internal/**,/app/**,/gateway/**,/baseDic/**,/developer/**,/apikey/**,/baseOrg/**,/baseAccountLogs/**,/action/**,/api/**,/baseAuthorityAction/**,/baseAuthorityRole/**,/baseAuthorityUser/**,/baseAuthorityApp/**,/gatewayRateLimitApi/**,/gatewayIpLimitApi/**,/extend-field/**,/customForms/**,/customFormsItem/**
          metadata:
            serviceId: jbm-cluster-platform-center
        - id: jaja7-auth-local
          uri: http://127.0.0.1:5555
          predicates:
            - Path=/oauth2/**,/captcha/**,/qrcode/**,/internal/dev/**
    nacos:
      config:
        namespace: jbm7
        group: DEFAULT_GROUP
        refreshable-dataids: common.properties
        server-addr: 10.100.10.62:8848
        shared-dataids: common.properties,db.properties,redis.properties,rabbitmq.properties,baidu.properties
      discovery:
        namespace: jbm7
        group: DEFAULT_GROUP
        server-addr: 10.100.10.62:8848
    openfeign:
      client:
        config:
          jbm-cluster-platform-center:
            url: http://127.0.0.1:8888
          jbm-cluster-platform-auth:
            url: http://127.0.0.1:5555
    sentinel:
      datasource:
        ds1:
          nacos:
            namespace: jbm7

jbm:
  api:
    check-sign: true
    check-auth: true
    sign-expire-ms: 300000
    sign-ignores:
      - /**/login/**
      - /**/logout/**
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /qrcode/**
      - /code
    auth-ignores:
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /qrcode/**
      - /code
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /actuator/**

# jaja7 网关 SaReactorFilter 放行（覆盖 bootstrap 默认值，与 sign/auth-ignores 对齐）
security:
  ignore:
    whites:
      - /favicon.ico
      - /static/favicon.ico
      - /actuator/**
      - /code
      - /oauth2/**
      - /captcha/**
      - /qrcode/**
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /*/v2/api-docs
