server:
  port: 7777
spring:
  cloud:
    gateway:
      routes:
        - id: jaja7-center-local
          uri: http://127.0.0.1:8888
          predicates:
            - Path=/user/**,/current/**,/authority/**,/role/**,/menu/**,/account/**,/online/**,/statistics/**,/internal/**,/app/**,/gateway/**,/baseDic/**,/developer/**,/apikey/**,/baseOrg/**,/baseAccountLogs/**,/action/**,/api/**,/baseAuthorityAction/**,/baseAuthorityRole/**,/baseAuthorityUser/**,/baseAuthorityApp/**,/gatewayRateLimitApi/**,/gatewayIpLimitApi/**,/extend-field/**
          metadata:
            serviceId: jbm-cluster-platform-center
        - id: jaja7-auth-local
          uri: http://127.0.0.1:5555
          predicates:
            - Path=/oauth2/**,/captcha/**,/qrcode/**,/internal/dev/**
    nacos:
      config:
        namespace: jbm7
        group: DEFAULT_GROUP
        refreshable-dataids: common.properties
        server-addr: 10.100.10.62:8848
        shared-dataids: common.properties,db.properties,redis.properties,rabbitmq.properties,baidu.properties
      discovery:
        namespace: jbm7
        group: DEFAULT_GROUP
        server-addr: 10.100.10.62:8848
    sentinel:
      datasource:
        ds1:
          nacos:
            namespace: jbm7

jbm:
  api:
    check-sign: true
    check-auth: true
    sign-expire-ms: 300000
    sign-ignores:
      - /**/login/**
      - /**/logout/**
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /user/registrations
      - /**/user/registrations
      - /internal/dev/**
    auth-ignores:
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /user/registrations
      - /**/user/registrations
      - /internal/dev/**
      - /actuator/**
