server:
  port: 6060
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256
spring:
  liquibase:
    enabled: false
  codec:
    max-in-memory-size: 104857600
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.jbm.cluster.common.basic.configuration.TenantConfiguration
      - com.jbm.cluster.common.basic.configuration.LoginAssemblyConfiguration
      - com.jbm.cluster.common.basic.configuration.ForwardedHeaderConfig
      - com.jbm.cluster.common.basic.configuration.JbmBasicConfiguration
  mvc:
    favicon:
      enabled: false
    pathmatch:
      # 适配 boot 2.6 路由与 springfox 兼容
      matching-strategy: ant_path_matcher
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/error,i18n/message
  application:
    name: ${artifactId}
  cloud:
    #手动配置Bus id,
    bus:
      id: ${spring.application.name}:${server.port}
    # sentinel 配置
    sentinel:
      #      scg:
      #        fallback:
      #          mode: response
      #          response-status: 455
      #          response-body: error!
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            dataId: sentinel-${spring.application.name}.json
            groupId: ${spring.cloud.nacos.config.group}
            namespace: ${spring.profiles.active}
            data-type: json
            rule-type: flow
    gateway:
      discovery:
        locator:
          #表明gateway开启服务注册和发现的功能，并且spring cloud gateway自动根据服务发现为每一个服务创建了一个router，# 这个router将以服务名开头的请求路径转发到对应的服务
          enabled: true
          #将请求路径上的服务名配置为小写（因为服务注册的时候，向注册中心注册时将服务名转成大写的了,比如以/service-hi/*的请求路径被路由转发到服务名为service-hi的服务上
          lowerCaseServiceId: true
  profiles:
    active: ${profile.name}

management:
  endpoints:
    web:
      exposure:
        # 开放部分端点和自定义端点
        include: health,info,open

jbm:
  # 开放api
  api:
    # 登录密码：Auth 层强制 RSA 加密（无总开关）；仅 dev+demo 可配置明文
    login-plaintext-dev-only: false
    # 参数签名验证（可开关）
    check-sign: false
    check-sensitive-encrypt: false
    sign-expire-ms: 300000
    # 访问权限控制
    access-control: true
    # swagger调试,生产环境设为false
    api-debug: true
    # 始终放行
    permit-all:
      - /*/login/**
      - /*/logout/**
      - /*/oauth/**
      - /**/user/registrations
      - /user/registrations
      - /**/published-docs/**
      - /actuator/health
      - /actuator/info
    # 忽略权限鉴定
    authority-ignores:
      - /*/authority/granted/me
      - /*/authority/granted/me/menu
      - /*/current/user/**
    # API Key 授权范围校验忽略（与 sign-ignores 对齐公共路径）
    auth-ignores:
      - /oauth2/**
      - /**/oauth2/**
      - /captcha/**
      - /**/captcha/**
      - /qrcode/**
      - /code
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /actuator/**
      - /push/ws
      - /push/ws/**
      - /**/push/ws
      - /**/push/ws/**
    # 签名忽略
    sign-ignores:
      - /**/login/**
      - /**/logout/**
      - /oauth2/**
      - /**/oauth2/**
      - /oauth2/publicKey
      - /**/oauth2/publicKey
      - /captcha/**
      - /**/captcha/**
      - /qrcode/**
      - /code
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /published-docs/**
      - /**/published-docs/**
      - /push/ws
      - /push/ws/**
      - /**/push/ws
      - /**/push/ws/**
      - /**/doc/get/**
      - /**/doc/download/**


# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期 设为一天 (必定过期) 单位: 秒
  timeout: 86400
  # token临时有效期 (指定时间无操作就过期) 单位: 秒
  activity-timeout: 7200
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # 是否尝试从header里读取token
  is-read-header: true
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # token前缀
  token-prefix: "Bearer"
  # 是否输出操作日志
  is-log: true
  # 关闭启动时版本 ASCII（Bootstrap + 主上下文会各初始化一次，否则会打两遍）
  is-print: false
  oauth2:
    access-token-timeout: 86400
    client-token-timeout: 86400
    client-token-cache-hours: 24
    client-token-refresh-ahead-hours: 20

# 安全配置
security:
  # 验证码
  captcha:
    # 是否开启验证码
    enabled: true
    # 验证码类型 math 数组计算 char 字符验证
    type: MATH
    # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
    category: CIRCLE
    # 数字验证码位数
    numberLength: 1
    # 字符验证码长度
    charLength: 4
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
      - /baseOrg/**
  # 网关 SaReactorFilter 放行（与 jbm.api.sign-ignores 公共路径对齐）
  ignore:
    whites:
      - /favicon.ico
      - /static/favicon.ico
      - /actuator/**
      - /code
      - /auth/**
      - /admin/**
      - /oauth2/**
      - /captcha/**
      - /**/captcha/**
      - /qrcode/**
      - /user/registrations
      - /**/user/registrations
      - /user/sessions
      - /user/sessions/**
      - /**/user/sessions
      - /**/user/sessions/**
      - /internal/dev/**
      - /internal/trust/**
      - /*/v2/api-docs
      - /push/ws
      - /push/ws/**
      - /**/push/ws
      - /**/push/ws/**
      - /csrf
