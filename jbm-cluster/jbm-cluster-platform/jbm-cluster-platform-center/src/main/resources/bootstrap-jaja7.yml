server:
  port: 8888
spring:
  cloud:
    nacos:
      config:
        namespace: jbm7
        group: DEFAULT_GROUP
        refreshable-dataids: common.properties
        server-addr: 10.100.10.62:8848
        shared-dataids: common.properties,db.properties,redis.properties,rabbitmq.properties,baidu.properties
      discovery:
        namespace: jbm7
        group: DEFAULT_GROUP
        server-addr: 10.100.10.62:8848
jbm:
  cluster:
    # 迁移老库已有业务数据，禁止启动时重复灌用户/角色等业务种子
    data-init:
      enabled: false
      # 仍补全 Vue 标准菜单+按钮元数据（幂等 upsert，不创建测试用户）
      vue-rbac-metadata-enabled: true
      force-reset-default-password: true
      root-password: admin
  extend-field:
    enabled: true
    source: REDIS
    auto-flatten: true
    sync-local-to-redis-on-startup: false
    builtin-definition-controller-enabled: false
    tenant:
      enabled: true
      header: tenantId
      default-tenant-id: "0"
      use-default-when-missing: true
