server:
  port: 9999
spring:
  liquibase:
    enabled: false
  cloud:
    nacos:
      config:
        namespace: jbm7
        group: DEFAULT_GROUP
        refreshable-dataids: common.properties
        server-addr: 10.100.10.62:8848
        shared-dataids: common.properties,db.properties,redis.properties,rabbitmq.properties,doc.properties
      discovery:
        namespace: jbm7
        group: DEFAULT_GROUP
        server-addr: 10.100.10.62:8848
jbm:
  cluster:
    token-type: redis
    permit-all:
      - /get/**
      - /download/**
      - /getViewUrl/**
      - /v1/3rd/file/**
