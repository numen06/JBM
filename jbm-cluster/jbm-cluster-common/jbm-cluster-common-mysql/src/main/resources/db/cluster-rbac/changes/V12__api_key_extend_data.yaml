databaseChangeLog:
  - changeSet:
      id: legacy-base_api_key-extend_data
      author: jbm
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: base_api_key
        - not:
            columnExists:
              tableName: base_api_key
              columnName: extend_data
      changes:
        - addColumn:
            tableName: base_api_key
            columns:
              - column:
                  name: extend_data
                  type: LONGTEXT
  - changeSet:
      id: legacy-base_authority_apikey-extend_data
      author: jbm
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: base_authority_apikey
        - not:
            columnExists:
              tableName: base_authority_apikey
              columnName: extend_data
      changes:
        - addColumn:
            tableName: base_authority_apikey
            columns:
              - column:
                  name: extend_data
                  type: LONGTEXT
