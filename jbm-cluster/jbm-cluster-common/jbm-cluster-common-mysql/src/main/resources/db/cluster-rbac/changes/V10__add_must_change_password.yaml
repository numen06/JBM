databaseChangeLog:
  - changeSet:
      id: rbac-v10-must-change-password
      author: jbm
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: base_account
        - not:
            columnExists:
              tableName: base_account
              columnName: must_change_password
      changes:
        - addColumn:
            tableName: base_account
            columns:
              - column:
                  name: must_change_password
                  type: INT
                  defaultValueNumeric: 0
