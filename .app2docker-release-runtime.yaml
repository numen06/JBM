version: '1.0'
build:
  project_type: python
  use_project_dockerfile: true
  dockerfile_name: Dockerfile.app2docker
  platforms:
  - linux/amd64
  - linux/arm64
  build_args:
    RELEASE_VERSION: py-7.3-20261105.18
    JBM_COMMIT: '{full_commit}'
    RELEASE_TARGET: jbm-python-cluster
git:
  branch: py-7.3
image:
  name: registry.cn-shanghai.aliyuncs.com/okc/jbm-python-cluster
  tag: py-7.3-20261105.18
  push: true
push_mode: single
release:
  enabled: true
  platform: jbm
  mainline: py-7.3
  version_file: VERSION
  timezone: Asia/Shanghai
  immutable: true
  require_git_tag: true
  service_policies: {}
